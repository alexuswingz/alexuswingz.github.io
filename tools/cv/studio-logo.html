<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:400px;height:400px;overflow:hidden;background:#0b0d0c}
.g{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 75%)}
.glow{position:absolute;left:50%;top:45%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(62,227,154,.30),transparent 70%);filter:blur(24px)}
.m{position:absolute;inset:0;display:grid;place-items:center;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:140px;letter-spacing:-.07em;white-space:nowrap;color:#eef2ee;line-height:1;padding-bottom:30px}
.m em{font-style:normal;color:#3ee39a}
.t{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#a6b0a8}
.dot{position:absolute;right:52px;top:52px;width:14px;height:14px;border-radius:50%;background:#3ee39a;box-shadow:0 0 18px #3ee39a}
</style></head><body><div class="g"></div><div class="glow"></div><div class="m"><span>A<em>K</em>J</span></div><div class="t">Studio</div><div class="dot"></div></body></html>
